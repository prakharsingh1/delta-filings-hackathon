  <defs>
    <linearGradient id="britBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4002B"/>
      <stop offset="100%" stop-color="#B00020"/>
    </linearGradient>
  </defs>
  <rect width="56" height="56" rx="12" fill="url(#britBg)"/>
