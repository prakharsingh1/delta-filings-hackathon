<!-- Delta Filings identifier mark for HINDUNILVR (Hindustan Unilever Ltd).
     hul.co.in returns 403 to server-side fetches and Wikimedia has no clean
     square asset, so this is a purpose-drawn square mark in the company's
     brand blue — legible at avatar size, no network dependency. -->
<svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hindustan Unilever">
  <defs>
    <linearGradient id="hulBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F36C7"/><stop offset="100%" stop-color="#0D1F8F"/>
    </linearGradient>
  </defs>
  <rect width="56" height="56" rx="12" fill="url(#hulBg)"/>
  <text x="28" y="35.5" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">HUL</text>
</svg>
