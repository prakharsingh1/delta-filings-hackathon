<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'analytics.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title or 'Delta Filings' }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body { font-family: 'Inter', system-ui, sans-serif; }
        body {
            min-height: 100vh;
            background:
              radial-gradient(900px 500px at 10% -10%, rgba(99,102,241,0.20), transparent 60%),
              radial-gradient(800px 500px at 110% 10%, rgba(56,189,248,0.18), transparent 60%),
              radial-gradient(700px 500px at 50% 120%, rgba(236,72,153,0.10), transparent 60%),
              #fbfbfe;
            color: #0f172a;
        }
        .auth-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 20px;
            box-shadow: 0 30px 70px -30px rgba(15,23,42,0.22);
        }
        .field {
            width: 100%; padding: 12px 14px;
            background: white; border: 1.5px solid #e2e8f0;
            border-radius: 10px; font-size: 14px; color: #0f172a;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .field:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,0.15); }
        .label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg,#4f46e5,#6366f1);
            color: white; font-weight: 600;
            padding: 12px 18px; border-radius: 10px;
            box-shadow: 0 10px 25px -10px rgba(79,70,229,0.55);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 16px 30px -10px rgba(79,70,229,0.65); }
        .brand-badge {
            display: inline-flex; align-items: center; gap: 10px;
            text-decoration: none; color: inherit;
        }
        .brand-mark {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            color: #0f172a;
        }
        .error-box {
            background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
            font-size: 13px; padding: 10px 12px; border-radius: 10px;
            margin-bottom: 14px;
        }
        .divider { display:flex; align-items:center; gap:10px; color:#94a3b8; font-size:12px; margin: 18px 0; }
        .divider::before, .divider::after { content:''; flex:1; height:1px; background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="min-h-screen flex flex-col">
        <header class="max-w-6xl mx-auto w-full px-6 py-6">
            <a href="/" class="brand-badge">
                <div class="brand-mark">
                    <svg class="w-6 h-6" viewBox="0 0 104 120" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-label="Delta Filings">
                        <polygon points="8,42 34,30 34,108 8,120"/>
                        <polygon points="50,4 100,28 100,100 70,86 70,52 50,42"/>
                    </svg>
                </div>
                <div>
                    <div class="font-bold text-slate-900 leading-tight">Delta Filings</div>
                    <div class="text-[11px] text-slate-500 -mt-0.5">Governance Intelligence</div>
                </div>
            </a>
        </header>

        <main class="flex-1 flex items-center justify-center px-6 py-8">
            {% block content %}{% endblock %}
        </main>

        <footer class="py-6 text-center text-xs text-slate-500">
            © Delta Filings · Secure, session-based authentication
        </footer>
    </div>
</body>
</html>
