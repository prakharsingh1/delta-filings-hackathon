{% extends "auth_base.html" %}
{% set page_title = "Sign Up · Delta Filings" %}
{% block content %}
<div class="auth-card w-full max-w-md p-8 sm:p-10">
    <div class="mb-6">
        <h1 class="text-2xl font-bold tracking-tight">Create your account</h1>
        <p class="text-sm text-slate-500 mt-1">Free. No card required. Set up in under a minute.</p>
    </div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/signup" class="space-y-4" autocomplete="on">
        <div>
            <label class="label" for="name">Full name</label>
            <input class="field" type="text" id="name" name="name" placeholder="Jane Doe"
                   value="{{ form.name or '' }}" required minlength="2" maxlength="80">
        </div>
        <div>
            <label class="label" for="email">Work email</label>
            <input class="field" type="email" id="email" name="email" placeholder="you@company.com"
                   value="{{ form.email or '' }}" required>
        </div>
        <div>
            <label class="label" for="password">Password</label>
            <input class="field" type="password" id="password" name="password"
                   placeholder="At least 6 characters" required minlength="6">
        </div>
        <button class="btn-primary" type="submit">Create account →</button>
    </form>

    <div class="divider">or</div>

    <p class="text-sm text-center text-slate-600">
        Already have an account? <a href="/signin" class="font-semibold text-indigo-600 hover:text-indigo-700">Sign in</a>
    </p>
</div>
{% endblock %}
