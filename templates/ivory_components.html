{% macro icon(name, cls='icon') -%}<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{% if name=='file' %}<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 13h8m-8 4h5"/>{% elif name=='grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>{% elif name=='book' %}<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v16H6.5A2.5 2.5 0 0 0 4 20.5Z"/><path d="M4 20.5V4.5M8 6h8m-8 4h5"/>{% elif name=='pen' %}<path d="m15 5 4 4M4 20l5-1L21 7a2.8 2.8 0 0 0-4-4L5 15Z"/>{% elif name=='shield' %}<path d="m12 3-9 4v5c0 5 9 9 9 9s9-4 9-9V7Z"/><path d="m8 12 3 3 5-6"/>{% elif name=='check' %}<path d="m5 12 4 4L19 6"/>{% elif name=='arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>{% elif name=='up' %}<path d="M6 18 18 6M6 6h12v12"/>{% elif name=='plus' %}<path d="M12 5v14M5 12h14"/>{% elif name=='search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>{% elif name=='clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>{% elif name=='calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>{% elif name=='bolt' %}<path d="M13 2 4 14h7l-1 8 9-12h-7Z"/>{% elif name=='people' %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 4v2"/>{% elif name=='layers' %}<path d="m12 3 10 5-10 5L2 8Zm-10 9 10 5 10-5m-20 5 10 5 10-5"/>{% elif name=='eye' %}<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>{% elif name=='chev' %}<path d="m6 9 6 6 6-6"/>{% elif name=='close' %}<path d="m6 6 12 12M6 18 18 6"/>{% elif name=='diff' %}<path d="M12 3v18M5 8h14M5 16h14"/>{% elif name=='mail' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>{% endif %}</svg>{%- endmacro %}
{% macro eyebrow(text, dark=false) -%}<span class="eyebrow{% if dark %} eyebrow-dark{% endif %}"><i aria-hidden="true"></i>{{ text }}<i aria-hidden="true"></i></span>{%- endmacro %}
