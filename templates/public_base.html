<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'analytics.html' %}
    <script>
      // Public pages are light-only. Remove the dark class the shared analytics snippet may add,
      // without clearing the saved theme the signed-in app uses.
      (function() { document.documentElement.classList.remove('dark'); })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="description" content="{% block meta_description %}Delta Filings: deadlines, late fees, meetings, registers, insider-trading records, drafting and counterparty risk for Indian companies.{% endblock %}">
    <title>{% block title %}Delta Filings{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/site.css">
    <style>
        /* Compatibility layer: the blog and calculator templates use these class
           names. Mapped onto the flat site look (no gradients, one accent). */
        body.site { background: var(--paper); }
        .glass { background: #fff; border: 1px solid var(--line); }
        .btn-primary { background: var(--indigo); color: #fff; font-weight: 600; padding: 11px 20px; border-radius: 8px;
            display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; transition: background-color .15s ease; }
        .btn-primary:hover { background: var(--indigo-2); }
        .btn-ghost { background: #fff; color: var(--ink); font-weight: 600; padding: 11px 20px; border-radius: 8px; border: 1px solid var(--line); }
        .btn-ghost:hover { border-color: #c4c4cd; }
        .gradient-text { color: var(--indigo-2); background: none; -webkit-background-clip: initial; background-clip: initial; }
        .card-glass { background: #fff; border: 1px solid var(--line); border-radius: 12px; transition: border-color .15s ease; }
        .card-glass:hover { border-color: var(--indigo-line); transform: none; box-shadow: none; }
        .nav-link:hover { color: var(--ink); }
        .input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 15px; color: var(--ink); font-family: var(--sans); }
        .input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
        .label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; display: block; font-family: var(--mono); }
        .result { margin-top: 24px; padding: 20px; border-radius: 12px; background: var(--indigo-bg); border: 1px solid var(--indigo-line); }
        /* The blog and tools set their own tag look in Tailwind; keep ours out of their way. */
        .prose h2 { font-size: 1.5rem; font-weight: 600; margin: 2.2rem 0 .8rem; letter-spacing: -.02em; color: var(--ink); }
        .prose h3 { font-size: 1.15rem; font-weight: 600; margin: 1.6rem 0 .6rem; color: var(--ink); }
        .prose p { line-height: 1.75; color: var(--ink-2); margin-bottom: 1rem; font-size: 1.0625rem; }
        .prose p.lead { font-size: 1.2rem; line-height: 1.65; color: var(--ink-2); margin-bottom: 1.6rem; }
        .prose ul, .prose ol { padding-left: 1.5rem; margin-bottom: 1.2rem; }
        .prose ul { list-style: disc; } .prose ol { list-style: decimal; }
        .prose li { line-height: 1.75; color: var(--ink-2); margin-bottom: .4rem; font-size: 1.0625rem; }
        .prose strong { color: var(--ink); font-weight: 600; }
        .prose a { color: var(--indigo-2); }
        .text-slate-900, .text-slate-800 { color: var(--ink); } .text-slate-700, .text-slate-600 { color: var(--ink-2); }
        .text-slate-500 { color: var(--muted); }
        .page-body { padding-top: 24px; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="site">
    <a href="#main" class="skip">Skip to content</a>
    {% include 'site_header.html' %}
    <main id="main" class="page-body">
        {% block content %}{% endblock %}
    </main>
    {% include 'site_footer.html' %}
    {% block scripts %}{% endblock %}
</body>
</html>
