# Builds the Delta Filings desktop app for macOS (Apple Silicon and Intel),
# Windows and Linux. PyInstaller and Tauri cannot cross-compile, so each
# platform builds on its own runner.
#
# Signing is optional and switches on when these repository secrets exist:
#   macOS   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#           APPLE_SIGNING_IDENTITY ("Developer ID Application: ..."),
#           APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID  -> notarised
#   Windows WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#           (an OV certificate; Azure Artifact Signing is not offered in India)
#   Updates TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: macos-arm64, bundles: "app,dmg" }
          - { os: macos-15-intel, label: macos-x64, bundles: "app,dmg" }
          - { os: windows-2025, label: windows-x64, bundles: "msi,nsis" }
          - { os: ubuntu-24.04, label: linux-x64, bundles: "deb,rpm,appimage" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.15" keyring

      - name: Bundle CDN assets for offline use
        run: python desktop/vendor_assets.py

      - name: Freeze the backend
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pyinstaller desktop/delta-server.spec --noconfirm --distpath desktop/build

      - name: Smoke-test the frozen backend
        run: python desktop/smoke_test.py desktop/build/delta-server

      - name: Shell dependencies
        working-directory: desktop/shell
        run: npm ci || npm install

      - name: Build installers
        working-directory: desktop/shell
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Sign Windows installers
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem desktop/shell/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe | ForEach-Object {
            & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: delta-filings-${{ matrix.label }}
          path: |
            desktop/shell/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/shell/src-tauri/target/release/bundle/msi/*.msi
            desktop/shell/src-tauri/target/release/bundle/nsis/*.exe
            desktop/shell/src-tauri/target/release/bundle/deb/*.deb
            desktop/shell/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/shell/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
