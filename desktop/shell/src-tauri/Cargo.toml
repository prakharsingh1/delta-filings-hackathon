[package]
name = "delta-filings"
version = "0.1.2"
description = "Delta Filings desktop: corporate governance and compliance on your own computer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
strip = true
codegen-units = 4
opt-level = "s"
