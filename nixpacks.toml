# Force Railway to build this as a Python app.
# Without this, Railway sees package.json and tries to build as Node.

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["python3 -m venv /opt/venv", ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt"]

[start]
cmd = ". /opt/venv/bin/activate && gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
